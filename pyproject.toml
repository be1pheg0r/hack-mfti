[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hack-mfti-sber"
version = "0.1.0"
description = "Sber case solution for IT Purple Hack 2026"
requires-python = ">=3.10, <3.13"
readme = "README.md"
dependencies = [
    "colorama==0.4.6",
    "pyyaml==6.0.3",
    "pydantic==2.12.5",
    "pandas==3.0.2",
    "numpy==2.4.4",
    "scikit-learn==1.8.0",
    "catboost==1.2.10",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "torch==2.11.0",
    "accelerate==1.13.0",
    "transformers==5.5.2",
    "protobuf==7.34.1",
    "tqdm==4.67.3",
    "rapidfuzz==3.14.5",
    "huggingface-hub==1.9.2",
    "gradio==6.11.0",
    "datasets==4.8.4",
    "pytest",
    "kaggle",
    "jupyter",
    "optuna",
    "imbalanced-learn",
    "xgboost",
    "lightgbm",
    "umap-learn",
    "sentence-transformers",
    "mistralai",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "common*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

