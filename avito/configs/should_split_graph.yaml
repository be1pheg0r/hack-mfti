data:
  mc_map_filename: "rnc_mic_key_phrases.csv"
  markup_filename: "rnc_dataset_markup.json"
  rag_markup_path: "rnc_dataset_markup.json"

encoder:
  model_name: "sergeyzh/rubert-mini-frida"

vector_db:
  backend: "chroma"
  collection_name: "avito_descriptions"
  persist_dir: "avito/gitignore/chroma"
  search_k: 20
  balanced_k: 12
  persist: true

mistral:
  enabled: true
  models_list:
    - "mistral-medium-latest"
  timeout: 240
  max_attempts_per_call: 1
  reasoning_effort: "hard"
  temperature: 0.5

graph:
  verbose: true
  use_rag: true
  enable_categorization: true
  enable_drafts: true
  draft_stub_mode: "generate"
  pipeline_request_timeout_sec: 120

drafts:
  enabled: true
  temperature: 0.0
  reasoning_effort: "medium"

