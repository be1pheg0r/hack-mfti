enabled: false
params:
  n_estimators: 500
  learning_rate: 0.05
  max_depth: -1
  subsample: 0.9
  colsample_bytree: 0.9
for_tune:
  n_estimators:
    type: int
    low: 300
    high: 900
    step: 100
  learning_rate:
    type: float
    low: 0.01
    high: 0.2
    log: true
  max_depth:
    type: int
    low: -1
    high: 12
    step: 1
  subsample:
    type: float
    low: 0.7
    high: 1.0
    step: 0.05
  colsample_bytree:
    type: float
    low: 0.7
    high: 1.0
    step: 0.05
